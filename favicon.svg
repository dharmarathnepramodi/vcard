<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#08080A" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE54C" />
      <stop offset="100%" stop-color="#FFD500" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Icon Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#FFD500" stroke-width="2.5" stroke-opacity="0.8"/>

  <!-- Pineapple Crown Leaf Accents (Green & Gold touch) -->
  <path d="M 27 15 C 29 10, 32 8, 32 8 C 32 8, 35 10, 37 15 Z" fill="#FFE54C" opacity="0.9" />
  <path d="M 23 18 C 22 13, 25 11, 25 11 C 25 11, 28 14, 29 19 Z" fill="#FFD500" opacity="0.75" />
  <path d="M 41 18 C 42 13, 39 11, 39 11 C 39 11, 36 14, 35 19 Z" fill="#FFD500" opacity="0.75" />

  <!-- Monogram PD in Pineapple Yellow -->
  <text x="32" y="47" 
        font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="27" 
        font-weight="900" 
        letter-spacing="-1.5"
        fill="url(#yellowGrad)" 
        text-anchor="middle"
        filter="url(#glow)">PD</text>

  <!-- Small Aquatic Sparkle Accent -->
  <circle cx="49" cy="20" r="2.5" fill="#60A5FA" />
  <circle cx="49" cy="20" r="4.5" fill="#60A5FA" opacity="0.3" />
</svg>
